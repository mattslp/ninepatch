<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nine Patch Collective — Logo Color Picker</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 48px 24px;
      background: #f5f5f5;
      transition: background 0.3s;
    }

    h1 {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #888;
    }

    /* ── LOGO ── */
    .logo-wrap {
      background: white;
      border-radius: 16px;
      padding: 56px 72px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.08);
      transition: background 0.3s;
    }

    .logo-wrap svg {
      width: min(480px, 80vw);
      height: auto;
      display: block;
    }

    /* ── CONTROLS ── */
    .controls {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .control {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .control label {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #666;
    }

    .swatch-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type="color"] {
      -webkit-appearance: none;
      appearance: none;
      width: 52px;
      height: 52px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      padding: 0;
      background: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; border-radius: 50%; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
    input[type="color"]::-moz-color-swatch { border: none; border-radius: 50%; }

    .hex-input {
      font-family: 'Outfit', monospace;
      font-size: 0.9rem;
      font-weight: 500;
      color: #333;
      border: 1.5px solid #ddd;
      border-radius: 6px;
      padding: 8px 12px;
      width: 100px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }

    .hex-input:focus { border-color: #aaa; }

    /* ── BG TOGGLE ── */
    .bg-toggle {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .bg-btn {
      border: 1.5px solid #ddd;
      border-radius: 20px;
      padding: 6px 16px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
      background: white;
      color: #555;
      transition: all 0.15s;
    }

    .bg-btn.active {
      border-color: #333;
      background: #333;
      color: white;
    }

    .bg-btn.dark.active {
      border-color: #111;
      background: #111;
    }

    /* ── RESET ── */
    .reset-btn {
      border: none;
      background: none;
      font-family: 'Outfit', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      color: #aaa;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.2s;
    }

    .reset-btn:hover { color: #555; }
  </style>
</head>

  <!-- Controls -->
  <div class="controls">
    <div class="control">
      <label>Primary Color</label>
      <div class="swatch-row">
        <input type="color" id="color1" value="#045359" />
        <input type="text" class="hex-input" id="hex1" value="#045359" maxlength="7" spellcheck="false" />
      </div>
    </div>
    <div class="control">
      <label>Secondary Color</label>
      <div class="swatch-row">
        <input type="color" id="color2" value="#85d4d6" />
        <input type="text" class="hex-input" id="hex2" value="#85d4d6" maxlength="7" spellcheck="false" />
      </div>
    </div>
  </div>

  <!-- Background toggle -->
  <div class="control" style="align-items:center;">
    <label>Background</label>
    <div class="bg-toggle">
      <button class="bg-btn active" data-bg="#ffffff" onclick="setBg(this,'#ffffff','#f5f5f5')">White</button>
      <button class="bg-btn" data-bg="#f5f5f5" onclick="setBg(this,'#f5f5f5','#f5f5f5')">Light</button>
      <button class="bg-btn dark" data-bg="#1a1a1a" onclick="setBg(this,'#1a1a1a','#111')">Dark</button>
    </div>
  </div>

  <button class="reset-btn" onclick="reset()">Reset to defaults</button>

  <script>
    const c1Input   = document.getElementById('color1');
    const c2Input   = document.getElementById('color2');
    const hex1Input = document.getElementById('hex1');
    const hex2Input = document.getElementById('hex2');

    function applyColors() {
      const c1 = c1Input.value;
      const c2 = c2Input.value;
      document.querySelectorAll('#logo .c1').forEach(el => el.style.fill = c1);
      document.querySelectorAll('#logo .c2').forEach(el => el.style.fill = c2);
    }

    function isValidHex(v) { return /^#[0-9a-fA-F]{6}$/.test(v); }

    c1Input.addEventListener('input', () => {
      hex1Input.value = c1Input.value;
      applyColors();
    });

    c2Input.addEventListener('input', () => {
      hex2Input.value = c2Input.value;
      applyColors();
    });

    hex1Input.addEventListener('input', () => {
      const v = hex1Input.value.startsWith('#') ? hex1Input.value : '#' + hex1Input.value;
      if (isValidHex(v)) { c1Input.value = v; applyColors(); }
    });

    hex2Input.addEventListener('input', () => {
      const v = hex2Input.value.startsWith('#') ? hex2Input.value : '#' + hex2Input.value;
      if (isValidHex(v)) { c2Input.value = v; applyColors(); }
    });

    function setBg(btn, wrapColor, bodyColor) {
      document.querySelectorAll('.bg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('logoWrap').style.background = wrapColor;
      document.body.style.background = bodyColor;
    }

    function reset() {
      c1Input.value = '#045359'; hex1Input.value = '#045359';
      c2Input.value = '#85d4d6'; hex2Input.value = '#85d4d6';
      applyColors();
    }

    applyColors();
  </script>
